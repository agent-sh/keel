[package]
name = "keel-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Keel in a window of its own: a small native shell around the daemon's page"
publish = false

[[bin]]
name = "keel-desktop"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
webkit = { package = "webkit6", version = "0.6", features = ["v2_42"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
