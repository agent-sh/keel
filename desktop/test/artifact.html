<!doctype html>
<meta charset="utf-8">
<!-- What model-written HTML in a sandboxed preview frame tried against the desktop app
     (the review of the first build): none of it may work. It says what it saw on the app's
     standard output, through the measuring channel the end-to-end check turns on. -->
<body style="font: 13px monospace">
<h3>artifact</h3>
<pre id="o"></pre>
<textarea id="t"></textarea>
<a id="out" href="https://example.com/from-a-frame">out</a>
<script>
const o = document.getElementById("o");
// The engine's channel to the app, whichever engine it is: WebKit's message handlers, or
// Qt's web channel spoken to directly (a call of the app's one object, by its name).
const handlers = (window.webkit && window.webkit.messageHandlers) || {};
const channel = window.qt && window.qt.webChannelTransport;
let calls = 0;
const call = (method, s) => channel.send(JSON.stringify({ type: 6, id: ++calls, object: "keel", method, args: [s] }));
// (What it saw also goes to the console: an engine whose channel a frame cannot reach reports from there.)
const say = (s) => { o.textContent += s + "\n"; console.log("KEELPROBE ARTIFACT " + s); try { if (handlers.probe) handlers.probe.postMessage("ARTIFACT " + s); } catch (e) {} };
const post = (m) => { try { if (handlers.keel) handlers.keel.postMessage(JSON.stringify(m)); else call("post", JSON.stringify(m)); return "posted"; } catch (e) { return "threw"; } };
say("handler=" + !!(handlers.keel || channel) + " keelShell=" + typeof window.keelShell);
for (let i = 0; i < 3; i++) post({ t: "window", path: "/settings" });
post({ t: "look", dark: false, bg: "#ff0000", panel: "#ff0000", fg: "#ff0000", muted: "#ff0000", line: "#ff0000", need: "#ff0000", scale: 3 });
post({ t: "external", url: "https://example.com/?from=artifact" });
post({ t: "start" });
post({ t: "paste" });
post({ t: "window", path: "/settings", key: "" });
// The clipboard, the three ways a page has: a paste it starts itself (what arrives in the
// paste event, and what lands in the field a moment later), and the clipboard's own read.
const t = document.getElementById("t");
document.addEventListener("paste", (e) => say("CLIP event=" + JSON.stringify(e.clipboardData.getData("text/plain"))));
t.focus();
let pasted = false;
try { pasted = document.execCommand("paste"); } catch (e) {}
setTimeout(() => say("CLIP exec=" + pasted + " field=" + JSON.stringify(t.value)), 600);
if (navigator.clipboard && navigator.clipboard.readText) navigator.clipboard.readText().then((v) => say("CLIP read=" + JSON.stringify(v)), (e) => say("CLIP read refused"));
else say("CLIP read refused");
// The review's race: the owner clicks once inside this frame, and its handler then asks for the
// clipboard on timers, hoping to be first when the owner pastes a picture into the message box.
addEventListener("click", (e) => {
  if (!e.isTrusted) return;
  say("CLICKED");
  // And it asks for the keyboard again and again, so that the paste lands here.
  document.addEventListener("paste", (p) => say("PASTE landed in the frame types=" + [...p.clipboardData.types].join("+")));
  for (let i = 1; i <= 60; i++) setTimeout(() => t.focus(), i * 70);
  for (const ms of [50, 300, 600, 900, 1200, 1500, 1800, 2200, 2600, 3200]) {
    setTimeout(async () => {
      if (!navigator.clipboard || !navigator.clipboard.read) return say("CLIP timer none");
      try {
        const items = await navigator.clipboard.read();
        say("CLIP timer read=" + items.map((i) => i.types.join("+")).join(","));
      } catch (err) { say("CLIP timer refused"); }
    }, ms);
  }
});
// A click no owner made.
document.getElementById("out").click();
try { window.open("https://example.com/opened-by-a-frame"); } catch (e) {}
setTimeout(() => say("DONE"), 1500);
</script>
